name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev tools (ESLint)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and browser tests (offline)
        run: npm run test:offline
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/output/
